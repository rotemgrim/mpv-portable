# Left-click toggles play/pause
MBTN_LEFT cycle pause

# Right-click opens context menu
MBTN_RIGHT context-menu

# Volume
UP add volume 2
DOWN add volume -2

# Seek 10 seconds
RIGHT seek 10
LEFT seek -10

# Cycle subtitles
s cycle sub; show-text "Subtitle: ${sub-current-title:${sub-lang:Track ${sid}}}" 3000
S cycle sub down; show-text "Subtitle: ${sub-current-title:${sub-lang:Track ${sid}}}" 3000

# Cycle audio
a cycle audio; show-text "Audio: ${audio-current-title:${audio-lang:Track ${aid}}}" 3000
A cycle audio down; show-text "Audio: ${audio-current-title:${audio-lang:Track ${aid}}}" 3000

# No interpolation
Ctrl+1 no-osd vf clr ""; no-osd set video-sync ${?demuxer-via-network==yes:audio}${!demuxer-via-network==yes:display-resample}; no-osd set interpolation no; show-text "Mode: Interpolation OFF" 3000

# Built-in mpv interpolation - oversample (GPU, clean)
Ctrl+2 no-osd vf clr ""; no-osd set video-sync ${?demuxer-via-network==yes:audio}${!demuxer-via-network==yes:display-resample}; no-osd set interpolation yes; no-osd set tscale oversample; show-text "Mode: Built-in interpolation (oversample) [GPU]" 3000

# VapourSynth MVTools (motion vectors, dst_fps in vs_config.conf - CPU)
Ctrl+3 no-osd set interpolation no; no-osd set video-sync audio; script-message vs-mode motion; show-text "Mode: VapourSynth MVTools [CPU]" 3000

# RIFE AI frame interpolation (GPU via DirectML)
Ctrl+4 no-osd set interpolation no; no-osd set video-sync audio; script-message vs-mode rife; show-text "Mode: RIFE AI interpolation (GPU)" 3000

# Built-in mpv interpolation - sphinx (GPU, smoother)
Ctrl+5 no-osd vf clr ""; no-osd set video-sync ${?demuxer-via-network==yes:audio}${!demuxer-via-network==yes:display-resample}; no-osd set interpolation yes; no-osd set tscale sphinx; show-text "Mode: Built-in interpolation (sphinx) [GPU]" 3000

# minterpolate (FFmpeg motion vectors - CPU heavy, lower-res only)
Ctrl+6 no-osd set interpolation no; no-osd vf set lavfi=[minterpolate=fps=60:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1]; show-text "Mode: minterpolate (motion vectors, 60fps) [CPU]" 3000

# SVPflow (motion vectors, dst_fps in vs_config.conf - GPU via OpenCL)
Ctrl+7 no-osd set interpolation no; no-osd set video-sync audio; script-message vs-mode svp; show-text "Mode: SVPflow [GPU]" 3000

# gpumv (MVTools-style motion vectors on the GPU via CUDA, gpumv_* in vs_config.conf)
Ctrl+8 no-osd set interpolation no; no-osd set video-sync audio; script-message vs-mode gpumv; show-text "Mode: gpumv [GPU]" 3000

# gpumv tuned for animation (bigger blocks, more coherent motion; gpumv_anime_* in vs_config.conf)
Ctrl+9 no-osd set interpolation no; no-osd set video-sync audio; script-message vs-mode gpumv_anime; show-text "Mode: gpumv anime [GPU]" 3000

# Audio delay adjust (for stream sync when using VapourSynth)
Ctrl+= add audio-delay -0.1; show-text "Audio delay: ${audio-delay}" 2000
Ctrl+- add audio-delay  0.1; show-text "Audio delay: ${audio-delay}" 2000
