# VapourSynth MVTools Configuration
# Edit values here, or use the motion smoothing settings window (Ctrl+G)

# Target FPS for MVTools and SVP. auto = display refresh rate, divided by
# the smallest whole number that brings it to max_fps or below
dst_fps=auto
max_fps=120

# mv.Super
pel=1
sharp=2

# mv.Analyse
blksize=32
overlap=0
search=2
searchparam=2
truemotion=1
dct=0

# mv.BlockFPS / mv.FlowFPS
mode=3
blend=1
thscd1=400
thscd2=130
ml=100

# Use FlowFPS instead of BlockFPS (0=BlockFPS, 1=FlowFPS)
use_flow=0

# Thread count (0 = auto)
threads=0

# === gpumv: MVTools-style interpolation on the GPU (Ctrl+8) ===
# Also uses dst_fps, max_fps, pel, thscd1, thscd2 and ml from above

# 0 = block (like BlockFPS), 1 = flow (like FlowFPS), 2 = adaptive (cleaner
# object edges, occlusion handling and artifact masking)
gpumv_mode=2

# Scene cuts: 0 = show the nearest real frame, 1 = cross-fade
gpumv_blend=0

# Adaptive mode: how strongly badly matched areas fall back to a plain blend (0-1)
gpumv_mask=0.5

# Animation drawn on twos/threes: spread motion over held frames (1) or keep them (0)
gpumv_dedup=1

# Keep letterbox bars still (1) and follow fades in brightness (1)
gpumv_bars=1
gpumv_fades=1

# Look: 1.0 = smooth (every in-between frame built), 0.6 = natural (real frames
# stay on screen longer, about half the smoothing, closer to the film's own feel)
gpumv_strength=1.0

# Motion coherence: higher keeps neighbouring vectors closer together
gpumv_lambda=0.1

# Motion source for films: NVIDIA optical-flow hardware (RTX 20 and later),
# 0 = gpumv's own search, 1 = fast, 2 = medium (best on the film tests), 3 = slow.
# GPUs without it fall back to the own search automatically
gpumv_nvof=2

# gpumv anime preset (Ctrl+9): flat line art scores best with bigger blocks,
# a much more coherent vector field and stronger artifact masking
gpumv_anime_blksize=32
gpumv_anime_lambda=2.0
gpumv_anime_mask=1.0
# The anime settings need gpumv's own search
gpumv_anime_nvof=0

# Block size: 8, 16 or 32. 16 scored best in tests
gpumv_blksize=16

# === RIFE AI Interpolation (GPU) ===

# FPS multiplier (2 = double, 2.5, 3, 4), or auto = match the display like
# dst_fps, capped at rife_max_fps (RIFE manages ~75 fps at 1080p on an RTX 5080)
rife_multi=auto
rife_max_fps=60

# Model version (46 = v4.6, 410 = v4.10)
rife_model=410

# GPU streams (more = faster but more VRAM). mpv reloads the script on every
# seek and each TensorRT-RTX stream takes ~2.5s to load, so keep this low.
rife_streams=2

# Half precision (1 = on, faster + less VRAM. 0 = off, more accurate)
rife_fp16=1

# Ensemble mode (1 = on, better quality but 2x slower. 0 = off)
rife_ensemble=0
